    <div class="question">
      <p><strong>2. ¿Qué etiqueta se usa para crear un enlace?</strong></p>

        <input type="radio" id="q2c" name="q2" class="incorrect">
        <label for="q2c">&lt;href&gt;</label>
      </div>
